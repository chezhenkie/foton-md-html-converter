[package]
name = "foton-md-html-converter"
version = "1.6.0"
edition = "2024"
build = "build.rs"
authors = ["westercoder"]
description = "Markdown to styled HTML converter"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"

[lib]
path = "lib.rs"

[[bin]]
name = "foton-md-html-converter-x64"
path = "main.rs"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true

name: cache-cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Only gh api calls; a hang means something is wrong with the token, not
    # that the job needs more time.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # Artifacts share the account-wide 500 MB quota with Packages. This repo
      # builds on every push and every PR, so without pruning the quota is gone
      # within a week. Keep only the newest artifact per name.
      - name: Fetch artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | [.id, .name, .created_at] | @tsv' > artifacts.txt
          wc -l < artifacts.txt

      - name: Delete artifacts except newest per name
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # read ... || [ -n "$id" ] so a file without a trailing newline does
          # not silently drop its last record from the sweep.
          declare -A best bestid
          while IFS=$'\t' read -r id name created || [ -n "$id" ]; do
            if [ "$created" \> "${best[$name]}" ] 2>/dev/null || [ -z "${best[$name]}" ]; then
              best[$name]=$created
              bestid[$name]=$id
            fi
          done < artifacts.txt
          while IFS=$'\t' read -r id name created || [ -n "$id" ]; do
            if [ "$id" != "${bestid[$name]}" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" > /dev/null 2>&1 || true
              echo "deleted superseded artifact $id ($name)"
            fi
          done < artifacts.txt
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: foton-md-html-converter-linux-musl
          path: target/x86_64-unknown-linux-musl/release/foton-md-html-converter-x64
          # Without this the artifact inherits the repo default of 90 days and
          # every PR run piles up against the 500 MB account quota.
          retention-days: 7

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: foton-md-html-converter-windows
          path: target/release/foton-md-html-converter-x64.exe
          retention-days: 7
